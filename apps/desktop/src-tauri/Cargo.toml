[package]
name = "clipmesh-desktop"
version.workspace = true
edition = "2021"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ClipMesh desktop application: Tauri host, tray, autostart and the IPC command layer"
authors = ["ClipMesh contributors"]

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name, which
# is required on Windows (see rust-lang/cargo#8519).
name = "clipmesh_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# The tray is desktop-only: `tray-icon` does not build for Android. The Android
# host depends on this crate with `default-features = false` so it can reuse the
# whole command layer without dragging a desktop-only dependency in.
default = ["desktop-tray"]
desktop-tray = ["tauri/tray-icon"]

[dependencies]
clipmesh-protocol.workspace = true
clipmesh-identity.workspace = true
clipmesh-security.workspace = true
clipmesh-core.workspace = true
clipmesh-network.workspace = true
clipmesh-clipboard.workspace = true

tauri = { version = "2", features = ["image-png"] }
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
parking_lot.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
base64.workspace = true
image.workspace = true

[dev-dependencies]
tempfile = "3"

# The release profile lives in the workspace root; a member crate cannot
# override it, and declaring one here would only produce a warning.
