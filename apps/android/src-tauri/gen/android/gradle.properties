# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Our old plugin template had a bug that caused missing `consumer-rules.pro` files
# so we have to disable it for now.
# See https://github.com/tauri-apps/tauri/pull/15828#issuecomment-5199937796
android.proguard.failOnMissingFiles=false

# Keeping Gradle 9 compatible with current plugins
# TODO: Remove this in v3
android.builtInKotlin=false
android.newDsl=false

# ---------------------------------------------------------------------------
# Which CPU architectures to build for.
#
# Read by the `rust` Gradle plugin that `tauri android init` generated
# (buildSrc/src/main/java/app/cm/clipmesh/kotlin/RustPlugin.kt):
#
#   targetList - Rust targets to cross-compile
#   archList   - the matching Gradle flavor names, PAIRED BY INDEX with targetList
#   abiList    - what the `universal` flavor packages
#
# ClipMesh ships ARM only, so x86 and x86_64 are dropped. That removes two
# complete Rust dependency trees from the build (roughly 10 GB under target/)
# and two ~300 MB copies of the native library from every APK.
#
# Emulators: an x86_64 emulator will not run these builds. Add the two x86
# targets back (or pass -PtargetList=aarch64,armv7,i686,x86_64 on the command
# line) if you need one.
# ---------------------------------------------------------------------------
targetList=aarch64,armv7
archList=arm64,arm
abiList=arm64-v8a,armeabi-v7a
